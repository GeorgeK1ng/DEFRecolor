name: Build release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: x86
            output: x86
            os: windows-2025
            dev_arch: amd64_x86
            toolset: "14.29"
          - arch: x64
            platform: x64
            output: x64
            os: windows-2025
            dev_arch: x64
            toolset: "14.29"
          - arch: ARM64
            platform: ARM64
            output: arm64
            os: windows-11-arm
            dev_arch: arm64
            toolset: ""

    steps:
      - name: Check out source and provider
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC v142
        if: matrix.toolset != ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.dev_arch }}
          toolset: ${{ matrix.toolset }}

      - name: Set up native ARM64 MSVC
        if: matrix.toolset == ''
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.dev_arch }}

      - name: Build DEFRecolor and DefThumbnailProvider
        run: >-
          msbuild DEFRecolor.sln
          /m
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}

      - name: Verify executable resources and startup
        shell: pwsh
        run: |
          $output = "build/release/${{ matrix.output }}"
          $exe = Join-Path $output "DEFRecolor.exe"
          $provider = Join-Path $output "DefThumbnailProvider.dll"
          if (!(Test-Path $exe) -or !(Test-Path $provider)) {
            throw "The executable or DefThumbnailProvider.dll is missing from $output."
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "DEFRecolor.exe does not contain a usable application icon."
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
            throw "DEFRecolor.exe exited during the GUI startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Prepare standalone package
        shell: pwsh
        run: |
          $package = "package/DEFRecolor-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$package/languages" | Out-Null
          New-Item -ItemType Directory -Force "$package/licenses/DefThumbnailProvider" | Out-Null
          Copy-Item "build/release/${{ matrix.output }}/DEFRecolor.exe" $package
          Copy-Item "build/release/${{ matrix.output }}/DefThumbnailProvider.dll" $package
          Copy-Item "languages/*.json" "$package/languages"
          Copy-Item README.md, LICENSE $package
          Copy-Item "external/DefThumbnailProvider/LICENSE" "$package/licenses/DefThumbnailProvider"
          if (Test-Path "external/DefThumbnailProvider/LICENSES") {
            Copy-Item "external/DefThumbnailProvider/LICENSES" "$package/licenses/DefThumbnailProvider/LICENSES" -Recurse
          }

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: DEFRecolor-${{ matrix.arch }}
          path: package/DEFRecolor-${{ matrix.arch }}
          if-no-files-found: error
