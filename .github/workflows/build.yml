name: Build release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
            output: x86
          - arch: x64
            platform: x64
            output: x64
          - arch: ARM64
            platform: ARM64
            output: arm64

    steps:
      - name: Check out source and provider
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build DEFRecolor and DefThumbnailProvider
        run: >-
          msbuild DEFRecolor.sln
          /m
          /p:Configuration=Release
          /p:Platform=${{ matrix.platform }}

      - name: Prepare standalone package
        shell: pwsh
        run: |
          $package = "package/DEFRecolor-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$package/languages" | Out-Null
          New-Item -ItemType Directory -Force "$package/licenses/DefThumbnailProvider" | Out-Null
          Copy-Item "build/release/${{ matrix.output }}/DEFRecolor.exe" $package
          Copy-Item "build/release/${{ matrix.output }}/DefThumbnailProvider.dll" $package
          Copy-Item "languages/*.json" "$package/languages"
          Copy-Item README.md, LICENSE $package
          Copy-Item "external/DefThumbnailProvider/LICENSE" "$package/licenses/DefThumbnailProvider"
          if (Test-Path "external/DefThumbnailProvider/LICENSES") {
            Copy-Item "external/DefThumbnailProvider/LICENSES" "$package/licenses/DefThumbnailProvider/LICENSES" -Recurse
          }
          Compress-Archive -Path "$package/*" -DestinationPath "DEFRecolor-${{ matrix.arch }}.zip"

      - name: Upload standalone package
        uses: actions/upload-artifact@v4
        with:
          name: DEFRecolor-${{ matrix.arch }}
          path: DEFRecolor-${{ matrix.arch }}.zip
          if-no-files-found: error
