name: Build release packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: x86
            output: x86
            os: windows-2025
            target_arch: x86
            host_arch: x64
            vcvars: "-vcvars_ver=14.29"
          - arch: x64
            platform: x64
            output: x64
            os: windows-2025
            target_arch: x64
            host_arch: x64
            vcvars: "-vcvars_ver=14.29"
          - arch: ARM64
            platform: ARM64
            output: arm64
            os: windows-11-arm
            target_arch: arm64
            host_arch: arm64
            vcvars: ""

    steps:
      - name: Check out source and provider
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build DEFRecolor and DefThumbnailProvider
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with MSBuild was not found.
            exit /b 1
          )
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=${{ matrix.target_arch }} -host_arch=${{ matrix.host_arch }} ${{ matrix.vcvars }}
          if errorlevel 1 exit /b 1
          msbuild DEFRecolor.sln /m /p:Configuration=Release /p:Platform=${{ matrix.platform }}

      - name: Verify executable resources and startup
        shell: pwsh
        run: |
          $output = "build/release/${{ matrix.output }}"
          $exe = Join-Path $output "DEFRecolor.exe"
          $provider = Join-Path $output "DefThumbnailProvider.dll"
          if (!(Test-Path $exe) -or !(Test-Path $provider)) {
            throw "The executable or DefThumbnailProvider.dll is missing from $output."
          }
          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon -or $icon.Width -lt 16 -or $icon.Height -lt 16) {
            throw "DEFRecolor.exe does not contain a usable application icon."
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 3
          if ($process.HasExited) {
            throw "DEFRecolor.exe exited during the GUI startup smoke test (exit code $($process.ExitCode))."
          }
          Stop-Process -Id $process.Id -Force

      - name: Prepare standalone package
        shell: pwsh
        run: |
          $package = "package/DEFRecolor-${{ matrix.arch }}"
          New-Item -ItemType Directory -Force "$package/languages" | Out-Null
          Copy-Item "build/release/${{ matrix.output }}/DEFRecolor.exe" $package
          Copy-Item "build/release/${{ matrix.output }}/DefThumbnailProvider.dll" $package
          Copy-Item "languages/*.json" "$package/languages"
          Copy-Item README.md $package

          if ((Test-Path "$package/LICENSE" -PathType Leaf) -or
              (Test-Path "$package/licenses" -PathType Container)) {
            throw "Standalone package must not contain a separate LICENSE file or licenses directory."
          }

          $requiredFiles = @(
            "$package/DEFRecolor.exe",
            "$package/DefThumbnailProvider.dll",
            "$package/README.md"
          )
          foreach ($requiredFile in $requiredFiles) {
            if (!(Test-Path -LiteralPath $requiredFile -PathType Leaf)) {
              throw "Release package is incomplete: $requiredFile is missing."
            }
          }

          $sourceLanguages = @(Get-ChildItem "languages" -Filter "*.json" -File)
          $packagedLanguages = @(Get-ChildItem "$package/languages" -Filter "*.json" -File)
          if ($sourceLanguages.Count -eq 0 -or $packagedLanguages.Count -ne $sourceLanguages.Count) {
            throw "Release package contains $($packagedLanguages.Count) of $($sourceLanguages.Count) language files."
          }
          foreach ($language in $packagedLanguages) {
            try {
              Get-Content -LiteralPath $language.FullName -Raw | ConvertFrom-Json | Out-Null
            }
            catch {
              throw "Invalid language file in release package: $($language.Name). $($_.Exception.Message)"
            }
          }

      - name: Upload standalone package
        uses: actions/upload-artifact@v6
        with:
          name: DEFRecolor-${{ matrix.arch }}
          path: package/DEFRecolor-${{ matrix.arch }}
          if-no-files-found: error
